        const [expression, setExpression] = useState("normal");

        const [currentEvent, setCurrentEvent] = useState(null);
        const [gameOver, setGameOver] = useState(false);
        const [isGameEnded, setIsGameEnded] = useState(false);

        // Fetch dynamic styles based on current state
        const currentTheme = getWeekDynamicTheme(weeks, personality, idolName);

        // Sync Initial Profile Stats on change
        useEffect(() => {
            if (isPlaying) return;
            if (personality === "idol") {
                setMoney(40000); setFame(25); setSubculture(5); setMental(100);
            } else if (personality === "punk") {
                setMoney(15000); setFame(5); setSubculture(35); setMental(75);
            } else {
                setMoney(30000); setFame(0); setSubculture(18); setMental(100);
            }
        }, [personality, isPlaying]);

        // Web Audio API Retro synthesizer sound system
        const playSynthSound = (type) => {
            if (isMuted) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === "beep") {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (type === "coin") {
                    osc.type = "square";
                    osc.frequency.setValueAtTime(987.77, ctx.currentTime);
                    osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === "damage") {
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(140, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(30, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === "synth") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(220, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === "level") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
                    osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.24);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
                    osc.start(); osc.stop(ctx.currentTime + 0.45);
                }
            } catch (e) {
                console.warn(e);
            }
        };

        const addLog = (message) => {
            setLog((prev) => [message, ...prev]);
        };

        // Random events scheduler
        const triggerTurnEnd = () => {
            if (weeks <= 1) {
                setWeeks(0);
                setIsGameEnded(true);
                playSynthSound("level");
                return;
            }
            
            // Countdown week
            setWeeks((prev) => prev - 1);

            // Run random event check (approx 40% probability)
            if (Math.random() < 0.42) {
                const randomEv = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
                setTimeout(() => {
                    setCurrentEvent(randomEv);
                    playSynthSound("synth");
                }, 800);
            }
        };

        // Event handler resolution
        const handleResolveEvent = () => {
            if (!currentEvent) return;
            const eff = currentEvent.effect;
            
            if (eff.money) setMoney((prev) => prev + eff.money);
            if (eff.fame) setFame((prev) => prev + eff.fame);
            if (eff.subculture) setSubculture((prev) => prev + eff.subculture);
            if (eff.mental) setMental((prev) => Math.max(0, Math.min(100, prev + eff.mental)));
            
            addLog(`【事件終息】「${currentEvent.title}」の影響を受けました。`);
            
            if (eff.skipTurn) {
                addLog("（心痛により1ターンを強制休養しました）");
            }

            const currentMentalVal = mental + (eff.mental || 0);
            if (currentMentalVal <= 0) {
                handleBreakdown();
            }

            setCurrentEvent(null);
        };

        const handleBreakdown = () => {
            setGameOver(true);
            playSynthSound("damage");
            setExpression("breakdown");
            addLog("【精神崩壊】限界を超えてメンタルが消失しました。高円寺の片隅で、心が完全に折れてしまいました...");
        };

        // 1. Vintage cloth action
        const handleVintageOutfit = () => {
            if (weeks <= 0 || gameOver) return;
            if (money < 5000) {
                playSynthSound("damage");
                addLog("資金不足！古着屋で買い物を楽しむお金が足りません。（￥5,000必要）");
                return;
            }

            playSynthSound("coin");
            setExpression("excited");
            setMoney((prev) => prev - 5000);

            // Try to draw a new random outfit that wasn't unlocked, else get standard
            const locked = OUTFITS.filter(o => !unlockedOutfits.some(uo => uo.id === o.id));
            let drawn = null;
            if (locked.length > 0) {
                drawn = locked[Math.floor(Math.random() * locked.length)];
                setUnlockedOutfits((prev) => [...prev, drawn]);
                setEquippedOutfit(drawn);
                setSubculture((prev) => prev + drawn.bonusSubculture);
            } else {
                // Randomly select already unlocked to equip
                drawn = OUTFITS[Math.floor(Math.random() * OUTFITS.length)];
                setEquippedOutfit(drawn);
                setSubculture((prev) => prev + 10);
            }

            const basePhrase = ACTION_LOG_PHRASES.vintage[Math.floor(Math.random() * ACTION_LOG_PHRASES.vintage.length)];
            addLog(`${basePhrase} 【${drawn.name}】(${drawn.rarity})を纏い、サブカル度がさらに高まった！ (資金 -5000円 / サブカル度 +${drawn.bonusSubculture})`);

            setTimeout(() => setExpression("normal"), 1500);
            triggerTurnEnd();
        };

        // 2. Cafe Lyrics formulation
        const generateLyricStr = () => {
            const sub = LYRIC_SUBJECTS[Math.floor(Math.random() * LYRIC_SUBJECTS.length)];
            const adj = LYRIC_ADJECTIVES[Math.floor(Math.random() * LYRIC_ADJECTIVES.length)];
            const vrb = LYRIC_VERBS[Math.floor(Math.random() * LYRIC_VERBS.length)];
            return `『${adj}${sub}${vrb}』`;
        };

        const handleCafeLyrics = () => {
            if (weeks <= 0 || gameOver) return;
            if (money < 1000) {
                playSynthSound("damage");
                addLog("資金不足！純喫茶に入るコーヒー代がありません。（￥1,000必要）");
                return;
            }

            playSynthSound("synth");
            setExpression("excited");
            setMoney((prev) => prev - 1000);

            // Literature build gets massive extra stats bonus
            const isLiterature = personality === "literature";
            const subcultureGained = isLiterature ? 12 : 5;
            const mentalGained = isLiterature ? 35 : 20;

            setSubculture((prev) => prev + subcultureGained);
            setMental((prev) => Math.min(100, prev + mentalGained));

            const newSong = generateLyricStr();
            setLyricsList((prev) => [newSong, ...prev]);

            const basePhrase = ACTION_LOG_PHRASES.cafe[Math.floor(Math.random() * ACTION_LOG_PHRASES.cafe.length)];
            const bonusText = isLiterature ? "【文学少女作詞ボーナス！】" : "";
            addLog(`${bonusText}${basePhrase} 新曲の詩が降りてきた：${newSong} (資金 -1000円 / サブカル度 +${subcultureGained} / メンタル +${mentalGained})`);

            setTimeout(() => setExpression("normal"), 1500);
            triggerTurnEnd();
        };

        // 3. Street live show
        const handleStreetShow = () => {
            if (weeks <= 0 || gameOver) return;
            
            playSynthSound("beep");
            setExpression("singing");

            // Character Identity bonus (Idol type is strong here)
            const isIdol = personality === "idol";
            const fameGained = isIdol ? 18 : 10;
            const mentalLoss = isIdol ? 8 : 15;

            setFame((prev) => prev + fameGained);
            setMental((prev) => Math.max(0, prev - mentalLoss));

            const basePhrase = ACTION_LOG_PHRASES.street[Math.floor(Math.random() * ACTION_LOG_PHRASES.street.length)];
            const bonusText = isIdol ? "【ガチ恋レトロ路上バズ！】" : "";
            addLog(`${bonusText}${basePhrase} 心を剥き出しにして歌った。 (知名度 +${fameGained} / メンタル -${mentalLoss})`);

            const currentMental = mental - mentalLoss;
            if (currentMental <= 0) {
                handleBreakdown();
                return;
            }

            setTimeout(() => setExpression("normal"), 1500);
            triggerTurnEnd();
        };

        // 4. Closed Live-house gig
        const handleLiveHouse = () => {
            if (weeks <= 0 || gameOver) return;
            if (mental < 25) {
                playSynthSound("damage");
                addLog("マイクを握る限界！ メンタルが低すぎ（25未満）て、プレッシャーに耐えきれず逃げ出してしまいます。まずは喫茶室で心を落ち着かせましょう。");
                return;
            }

            playSynthSound("coin");
            setExpression("singing");

            // Compute financial revenue scale
            const outfitMultiplier = equippedOutfit ? (1 + (equippedOutfit.bonusSubculture / 100)) : 1.0;
            const fameMultiplier = 1 + (fame / 100);
            const multiplier = outfitMultiplier * fameMultiplier;
            const baseRevenue = Math.floor(15000 + (Math.random() * 15000));
            const processedRevenue = Math.floor(baseRevenue * multiplier);

            // Punk type is incredible beast in closed clubs
            const isPunk = personality === "punk";
            const fameGained = isPunk ? 28 : 20;
            const subcultureGained = isPunk ? 12 : 0;
            const finalRevenue = isPunk ? Math.floor(processedRevenue * 1.15) : processedRevenue;

            setMoney((prev) => prev + finalRevenue);
            setFame((prev) => prev + fameGained);
            if (subcultureGained > 0) {
                setSubculture((prev) => prev + subcultureGained);
            }
            setMental((prev) => Math.max(0, prev - 25));

            const basePhrase = ACTION_LOG_PHRASES.club[Math.floor(Math.random() * ACTION_LOG_PHRASES.club.length)];
            const bonusText = isPunk ? "【電波パンク狂騒ギグ！】" : "";
            addLog(`${bonusText}${basePhrase} チケット代とチェキ・物販バックで大金【￥${finalRevenue.toLocaleString()}】を回収した！ (知名度+${fameGained} / メンタル-25)`);

            const currentMental = mental - 25;
            if (currentMental <= 0) {
                handleBreakdown();
                return;
            }

            setTimeout(() => setExpression("normal"), 1500);
            triggerTurnEnd();
        };

        // 5. Under-the-bridge Yakitori Job rescue command
        const handleYakitoriJob = () => {
            if (weeks <= 0 || gameOver) return;
            
            if (mental <= 15) {
                playSynthSound("damage");
                addLog("限界寸前！メンタルが低すぎ（15以下）て、高架下の焼き鳥屋の超高速焼き台と酔客の怒号についていけません。まずは休息を。");
                return;
            }

            playSynthSound("coin");
            setExpression("tired");

            const moneyGained = 15000;
            const isPunk = personality === "punk";
            const actualMentalCost = isPunk ? 18 : 25; 
            const bonusText = isPunk ? "【電波パンク超現場労働適性！】" : "";

            setMoney((prev) => prev + moneyGained);
            setMental((prev) => Math.max(0, prev - actualMentalCost));

            const phrases = [
                "高円寺ガード下の串焼き鳥屋で、もうもうと立ち込める煙と酔客のコールにまみれながら深夜3時まで網を磨いた。「夢を追うのも楽じゃないな」と店長から100円のチップをもらった。",
                "中央線高架下の赤提灯。吹き抜ける夜風と焼きビールの匂い。ジョッキを100枚洗い、精神力をお金に変えて泥のように働いた。",
                "深夜3時のガード下焼き鳥屋。明日の衣装代とマイクアンプのために、モクモクの煙のなかで狂ったように串を刺した。俺の火は消えていない。"
            ];
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];

            addLog(`${bonusText}【深夜バイト】${phrase} (資金 +${moneyGained.toLocaleString()}円 / メンタル -${actualMentalCost})`);

            const currentMental = mental - actualMentalCost;
            if (currentMental <= 0) {
                handleBreakdown();
                return;
            }

            setTimeout(() => setExpression("normal"), 1500);
            triggerTurnEnd();
        };

        const resetGame = () => {
            if (personality === "idol") {
                setMoney(40000); setFame(25); setSubculture(5); setMental(100);
            } else if (personality === "punk") {
                setMoney(15000); setFame(5); setSubculture(35); setMental(75);
            } else {
                setMoney(30000); setFame(0); setSubculture(18); setMental(100);
            }
            setWeeks(12);
            setEquippedOutfit(null);
            setUnlockedOutfits([]);
            setLyricsList([]);
            setLog([]);
            setExpression("normal");
            setGameOver(false);
            setIsGameEnded(false);
            addLog("新しい高円寺の12週間が始まりました。いざ、最高のメランコリックステージへ。");
        };

        // Compute Final Ending profile
        const getEndingDetails = () => {
            const totalScore = fame + subculture + (money / 1000);
            
            if (totalScore >= 160) {
                return {
                    title: "伝説のオモロサブカル新星・超絶ポップスタァ",
                    desc: "あなたは高円寺の王座に輝きました！サブカルチャーと大衆的人気を奇跡的なバランスで調和させ、日本武道館やフジロックをも揺らす次世代クリエイターとしての覚醒です。「私の言葉すべてが、この街のアンビエントになった」",
                    status: "神話入りエンド (SUCCESS)"

            } else if (fame >= 65) {
                return {
                    title: "メジャー第一線のガチ恋ポップアイドル",
                    desc: "あなたはJ-POPの王道を全力で駆け抜け、テレビやメジャー誌、そして大きなドームステージをファンで埋め尽くしました。高円寺の混沌とした煙は、いまや懐かしい思い出のなかの優しい記憶です。「みんなの笑顔だけが、私のすべて」",
                    status: "銀河系メジャーエンド (SUCCESS)"
                };
            } else if (subculture >= 75) {
                return {
                    title: "東高円寺アングラ界のオルタナ絶対教祖",
                    desc: "大衆には一切迎合せず、深夜のアンダーグラウンドを切り裂く唯一無二のカルトカリスマへ。あなたの書く激痛のポエムは熱狂的信者にタトゥーとして刻まれます。「売れることなんて軽蔑している。私はただ、君の血を流したいだけ」",
                    status: "アングラ絶対教祖エンド (SUCCESS)"
                };
            } else if (money >= 100000) {
                return {
                    title: "高円寺の路地裏を買い占めた不敵なインディーズ社長",
                    desc: "知名度よりも圧倒的マネー。ライブ物販の価格設定を高円寺ルック商店街ごとM&Aできる超資金力で制覇。インディーズレーベルの影のオーナーとして路地裏から若手を操ります。「音楽ってのはな、結局プロデュースとキャッシュフローだよ」",
                    status: "路地裏の帝王エンド (SAVED)"
                };
            } else {
                return {
                    title: "高架下の気だるい夢追い居残り少女",
                    desc: "メジャーにも教祖にもなりきれず、いつまでも高円寺の古着屋の匂いと安い居酒屋のポテトを貪る、平凡だけど特別な美しき居残りライフ。「まあいいよね、今日も中央線はガタゴト走って、メロンソーダは甘いんだから」",
                    status: "気だるい路地裏エンド (NORMAL)"
                };
            }
        };

        const ending = getEndingDetails();

        // Render Layout Component
        return (
            <div 
                id="game-container" 
                style={isPlaying ? { background: currentTheme.bgStyle } : undefined}
                className="min-h-screen text-gray-100 font-sans flex flex-col transition-all duration-1000 bg-[#0d0614]"
            >
                {/* Header */}
                <header className="border-b border-[#2d1b4e] bg-[#140b24] py-4 px-6 sticky top-0 z-40 shadow-lg">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="p-1.5 rounded-lg bg-pink-500/20 text-[#ff2a85] animate-pulse">
                                {/* Inline music SVG */}
                                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-sm md:text-base font-retro font-bold text-white tracking-widest uppercase flex items-center gap-1.5 flex-wrap">
                                    <span>高円寺メランコリック</span>
                                    <span className="text-pink-500 text-[10px] bg-pink-500/10 px-1.5 py-0.5 rounded border border-pink-500/20 tracking-normal normal-case">
                                        retro idol slg
                                    </span>
                                </h1>
                                <p className="text-[10px] text-gray-400 font-sans mt-0.5">
                                    中央線の歪んだノイズに響く、12週間のサブカル少女育成記録
                                </p>
                            </div>
                        </div>

                        <button 
                            onClick={() => {
                                setIsMuted(!isMuted);
                                playSynthSound("beep");
                            }}
                            className="group p-2 rounded-lg border border-[#2d1b4e] hover:border-pink-500 hover:bg-pink-500/5 transition cursor-pointer"
                        >
                            {isMuted ? (
                                <svg className="w-4 h-4 text-gray-500 group-hover:text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                                </svg>
                            ) : (
                                <svg className="w-4 h-4 text-emerald-400 group-hover:text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5V14.5H7.75L12 18.75Z" />
                                </svg>
                            )}
                        </button>
                    </div>
                </header>

                {/* Main UI body */}
                {!isPlaying ? (
                    /* Startup Configuration Screen */
                    <div className="flex-1 flex items-center justify-center p-6">
                        <div className="max-w-xl w-full bg-[#110820]/80 border-2 border-[#2d1b4e] hover:border-pink-500/40 rounded-2xl p-6 md:p-8 backdrop-blur shadow-[0_4px_30px_rgba(0,0,0,0.6)] relative overflow-hidden transition-all duration-500">
                            <div className="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-[#ff2a85] via-purple-600 to-emerald-400"></div>
                            
                            <div className="text-center mb-6">
                                <span className="text-[10px] font-retro tracking-widest text-[#ff2a85] bg-[#ff2a85]/10 border border-[#ff2a85]/30 px-3 py-1 rounded-full uppercase">
                                    ✦ 少女ノ初期プロファイル設計 ✦
                                </span>
                                <h2 className="text-xl md:text-2xl font-retro text-white mt-3 select-none">少女、高円寺を夢む。</h2>
                                <p className="text-[11px] text-gray-400 font-sans mt-2">
                                    あなたの手で髪型をセットし、高円寺に渦巻くアイデンティティ(属性)を選んでください。
                                </p>
                            </div>

                            <div className="space-y-5">
                                {/* Name Input */}
                                <div>
                                    <label className="block text-xs font-retro text-emerald-400 mb-2 tracking-wider">
                                        ✦ アイドル名
                                    </label>
                                    <input 
                                        type="text" 
                                        value={idolName}
                                        onChange={(e) => setIdolName(e.target.value)}
                                        className="w-full bg-[#07030d] border border-[#2d1b4e] focus:border-pink-500 focus:outline-none rounded-lg p-3 text-sm font-sans tracking-widest text-white shadow-inner"
                                        placeholder="お名前を決めてください"
                                    />
                                </div>

                                {/* Personality identity Direction selector */}
                                <div>
                                    <label className="block text-xs font-retro text-emerald-400 mb-2 tracking-wider">
                                        ✦ アイデンティティ・アイドルの方向性（初期ステータス）
                                    </label>
                                    <div className="space-y-2.5">
                                        {[
                                            { id: "idol", name: "ガチ恋レトロ歌謡系", bio: "昭和〜平成の王道レトロポップ。お祝儀や物販で安定した資金力があり路上ライブ（知名度上昇）が得意。反面、サブカル度は低め。", stats: "資金: ￥40,000 / 知名度: 25 / サブカル: 5 / メンタル: 100", color: "from-pink-500/20 to-rose-500/10 border-[#ff2a85] text-[#ff2a85]", glow: "shadow-[0_0_12px_rgba(255,42,133,0.3)] bg-[#ff2a85]/10" },
                                            { id: "punk", name: "メンヘラ電波パンク系", bio: "過激な詩と高速2STEP。コアな信者達が取り巻きサブカル度極高。精神不安定で資金は少なめだが、箱ライブ（ライブハウス）時に大バズする可能性あり。", stats: "資金: ￥15,000 / 知名度: 5 / サブカル: 35 / メンタル: 75", color: "from-purple-500/20 to-fuchsia-500/10 border-purple-500 text-purple-400", glow: "shadow-[0_0_12px_rgba(168,85,247,0.3)] bg-purple-950/20" },

                                        ].map((item) => (

                                                    personality === item.id

                                                }`}
                                            >
                                                <div className="flex justify-between items-center w-full">
                                                    <span className={`font-retro text-xs font-bold ${personality === item.id ? "text-white" : "text-gray-400"}`}>
                                                        ✦ {item.name}
                                                    </span>
                                                    {personality === item.id && (
                                                        <span className="text-[8px] font-retro bg-white/20 text-white px-1.5 py-0.5 rounded tracking-wider">
                                                            SELECTED
                                                        </span>
                                                    )}
                                                </div>
                                                <p className="text-[11px] text-gray-400 font-sans leading-relaxed">
                                                    {item.bio}
                                                </p>
                                                <div className="text-[10px] font-mono text-[#05ffa1] mt-0.5 tracking-wider">
                                                    {item.stats}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Hairstyle chooser */}
                                <div>
                                    <label className="block text-xs font-retro text-emerald-400 mb-2 tracking-wider">
                                        ✦ 髪型のセット
                                    </label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            { id: "bob", label: "レトロボブ" },
                                            { id: "twintail", label: "病みツインテ" },
                                            { id: "classic", label: "クラシカルロング" }
                                        ].map((p) => (
                                            <button

                                                onClick={() => {
                                                    setHairStyle(p.id);
                                                    playSynthSound("beep");
                                                }}
                                                className={`py-2 px-1 rounded-lg border text-xs font-sans transition cursor-pointer ${
                                                    hairStyle === p.id 
                                                        ? "border-[#ff2a85] bg-[#ff2a85]/10 text-white font-bold"
                                                        : "border-[#2d1b4e] hover:border-[#ff2a85]/60 bg-[#07030d]"
                                                }`}
                                            >
                                                {p.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Hair Color picker */}
                                <div>
                                    <label className="block text-xs font-retro text-emerald-400 mb-2 tracking-wider">
                                        ✦ 髪の毛の色調（サイケデリック）
                                    </label>
                                    <div className="flex items-center gap-3">
                                        <input 
                                            type="color" 
                                            value={hairColor}
                                            onChange={(e) => setHairColor(e.target.value)}
                                            className="w-10 h-10 border border-[#2d1b4e] bg-transparent rounded cursor-pointer"
                                        />
                                        <div className="font-mono text-xs text-gray-300">
                                            カラーコード: <span className="text-white bg-[#07030d] px-2 py-1 rounded ml-1">{hairColor.toUpperCase()}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Launch Button */}

                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                                        </svg>
                                                    </div>
                                                    <span className="text-xs bg-red-500/20 text-red-400 border border-red-500/20 px-1.5 py-0.5 rounded font-mono">
                                                        -￥5,000
                                                    </span>
                                                </div>
                                                <div>
                                                    <h4 className="text-xs font-bold font-retro text-slate-100 group-hover:text-pink-500 transition">
                                                        古着屋巡り
                                                    </h4>
                                                    <p className="text-[10px] text-gray-400 font-sans mt-1">
                                                        キタコレビルの深奥で個性的な古着を購入！
                                                    </p>
                                                </div>
                                                <div className="text-[9px] font-mono mt-1 text-purple-400 flex justify-between w-full">
                                                    <span>知名度 +0</span>
                                                    <span>サブカル +15〜35</span>
                                                </div>
                                            </button>

                                            {/* Cafe songwriting */}
                                            <button
                                                onClick={handleCafeLyrics}
                                                disabled={gameOver || isGameEnded}
                                                className="group border border-[#2d1b4e] bg-[#140b24] hover:border-[#05ffa1] hover:bg-[#05ffa1]/5 active:scale-[0.98] transition-all rounded-xl p-4 text-left cursor-pointer flex flex-col justify-between h-32 shadow-sm relative overflow-hidden"
                                            >
                                                <div className="flex items-start justify-between w-full">
                                                    <div className="p-2 rounded bg-emerald-500/10 text-emerald-400">
                                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                                        </svg>
                                                    </div>
                                                    <span className="text-xs bg-red-500/20 text-red-400 border border-red-500/20 px-1.5 py-0.5 rounded font-mono">
                                                        -￥1,000
                                                    </span>
                                                </div>
                                                <div>
                                                    <h4 className="text-xs font-bold font-retro text-slate-100 group-hover:text-emerald-400 transition font-sans">
                                                        純喫茶で作詞
                                                    </h4>
                                                    <p className="text-[10px] text-gray-400 font-sans mt-1">
                                                        喫茶七つ森でメロンソーダを頼み、詩を綴る。
                                                    </p>
                                                </div>
                                                <div className="text-[9px] font-mono mt-1 text-emerald-400 flex justify-between w-full">
                                                    <span>メンタル UP</span>
                                                    <span>サブカル度 UP</span>
                                                </div>
                                            </button>

                                            {/* Street music live performance */}
                                            <button
                                                onClick={handleStreetShow}
                                                disabled={gameOver || isGameEnded}
                                                className="group border border-[#2d1b4e] bg-[#140b24] hover:border-blue-400 hover:bg-blue-400/5 active:scale-[0.98] transition-all rounded-xl p-4 text-left cursor-pointer flex flex-col justify-between h-32 shadow-sm relative overflow-hidden"
                                            >
                                                <div className="flex items-start justify-between w-full">
                                                    <div className="p-2 rounded bg-blue-500/10 text-blue-400">
                                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5V14.5H7.75L12 18.75Z" />
                                                        </svg>
                                                    </div>
                                                    <span className="text-xs bg-emerald-500/20 text-[#05ffa1] border border-emerald-500/20 px-1.5 py-0.5 rounded font-mono">
                                                        FREE
                                                    </span>
                                                </div>
                                                <div>
                                                    <h4 className="text-xs font-bold font-retro text-slate-100 group-hover:text-blue-400 transition font-sans">
                                                        路上スポット
                                                    </h4>
                                                    <p className="text-[10px] text-gray-400 font-sans mt-1">
                                                        高円寺駅前で、痛切に魂の声を叫ぶ！
                                                    </p>
                                                </div>
                                                <div className="text-[9px] font-mono mt-1 text-rose-400 flex justify-between w-full">
                                                    <span>知名度 UP</span>
                                                    <span>メンタル -{personality === "idol" ? "8" : "15"}</span>
                                                </div>
                                            </button>

                                            {/* Underground Livehouse core gig */}
                                            <button
                                                onClick={handleLiveHouse}
                                                disabled={gameOver || isGameEnded}
                                                className="group border border-[#2d1b4e] bg-[#140b24] hover:border-purple-400 hover:bg-purple-400/5 active:scale-[0.98] transition-all rounded-xl p-4 text-left cursor-pointer flex flex-col justify-between h-32 shadow-sm relative overflow-hidden"
                                            >
                                                <div className="flex items-start justify-between w-full">
                                                    <div className="p-2 rounded bg-purple-500/10 text-purple-400">
                                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                                                        </svg>
                                                    </div>
                                                    <span className="text-xs bg-emerald-500/20 text-[#05ffa1] border border-emerald-500/20 px-1.5 py-0.5 rounded font-mono">
                                                        REVENUE
                                                    </span>
                                                </div>
                                                <div>
                                                    <h4 className="text-xs font-bold font-retro text-slate-100 group-hover:text-purple-400 transition font-sans">
                                                        ライブ出演
                                                    </h4>
                                                    <p className="text-[10px] text-gray-400 font-sans mt-1">
                                                        地下ライブに飛び込み、熱狂的観客からチェキ代回収！
                                                    </p>
                                                </div>
                                                <div className="text-[9px] font-mono mt-1 text-rose-400 flex justify-between w-full">
                                                    <span>知名度 UP</span>
                                                    <span>メンタル -25</span>
                                                </div>
                                            </button>

                                            {/* Yakitori Job (Emergency rescue command) */}
                                            <button
                                                onClick={handleYakitoriJob}
                                                disabled={gameOver || isGameEnded}
                                                className={`group border active:scale-[0.98] transition-all rounded-xl p-4 text-left cursor-pointer flex flex-col justify-between h-32 shadow-sm relative overflow-hidden ${
                                                    money < 5000
                                                        ? "border-[#ff2a85] bg-red-950/20 shadow-[0_0_12px_rgba(255,42,133,0.3)] animate-pulse"
                                                        : "border-[#2d1b4e] bg-[#140b24] hover:border-orange-500 hover:bg-orange-500/5"
                                                }`}
                                            >
                                                <div className="flex items-start justify-between w-full">
                                                    <div className={`p-2 rounded ${money < 5000 ? "bg-red-500/20 text-[#ff2a85] animate-bounce" : "bg-orange-500/10 text-orange-400"}`}>
                                                        {/* Flame SVG */}
                                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                                        </svg>
                                                    </div>
                                                    <span className="text-xs bg-emerald-500/20 text-[#05ffa1] border border-emerald-500/30 px-1.5 py-0.5 rounded font-mono">
                                                        +￥15,000
                                                    </span>
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-1.5">
                                                        <h4 className={`text-xs font-bold font-retro ${money < 5000 ? "text-[#ff2a85] font-extrabold" : "text-[#ff2a85] sm:text-orange-400"}`}>
                                                            深夜バイト
                                                        </h4>
                                                        {money < 5000 && (
                                                            <span className="text-[8px] font-retro bg-red-500 text-white px-1 rounded animate-pulse shrink-0">
                                                                緊急救援!
                                                            </span>
                                                        )}
                                                    </div>
                                                    <p className="text-[10px] text-gray-400 font-sans mt-1">
                                                        ガード下の焼き鳥屋：メンタルと引き換えにお金を稼ぐ！
                                                    </p>
                                                </div>
                                                <div className="text-[9px] font-mono mt-1 text-rose-400 flex justify-between w-full">
                                                    <span>知名度 +0</span>
                                                    <span>メンタル -{personality === "punk" ? "18" : "25"}</span>
                                                </div>
                                            </button>

                                        </div>
                                    </div>
                                )}

                                {/* Action Logs Feed and Lyric Collection board */}
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                    
                                    {/* Action Log Flow Feed */}
                                    <div className="md:col-span-8 bg-[#110820]/75 border border-[#2d1b4e] rounded-2xl p-4 shadow-lg min-h-[190px] flex flex-col justify-between">
                                        <div className="text-[10px] font-retro text-purple-300 mb-2 border-b border-[#2d1b4e]/40 pb-1.5 flex justify-between items-center">
                                            <span>✦ 高円寺・活動日誌ログフロー ✦</span>
                                            <button
                                                onClick={() => {
                                                    setLog([]);
                                                    playSynthSound("beep");
                                                }}
                                                className="text-[9px] px-2 py-0.5 bg-black/40 border border-[#2d1b4e] rounded text-gray-400 hover:text-white cursor-pointer"
                                            >
                                                クリア
                                            </button>
                                        </div>
                                        
                                        <div className="flex-1 overflow-y-auto max-h-[220px] space-y-2.5 pr-1 font-sans text-xs">
                                            {log.length === 0 ? (
                                                <p className="text-[10px] text-gray-500 italic text-center my-auto">
                                                    活動を開始してください。高円寺の記録がここに蓄積されます。
                                                </p>
                                            ) : (
                                                log.map((entry, idx) => (
                                                    <div 
                                                        key={idx} 
                                                        className={`p-2 rounded border border-l-4 leading-relaxed ${
                                                            entry.includes("深夜バイト") 
                                                                ? "border-amber-700/60 bg-amber-950/10 border-l-amber-500 text-amber-200" 
                                                                : entry.includes("バズ") || entry.includes("大金") || entry.includes("ボーナス")
                                                                ? "border-emerald-700/60 bg-emerald-950/10 border-l-[#05ffa1] text-[#05ffa1]" 
                                                                : entry.includes("事件") || entry.includes("精神崩壊") || entry.includes("深夜バイト")
                                                                ? "border-red-900/60 bg-red-950/10 border-l-red-500 text-red-300"
                                                                : "border-[#2d1b4e]/80 bg-black/20 border-l-purple-500 text-gray-200"
                                                        }`}
                                                    >
                                                        {entry}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    {/* Lyric List Pool */}
                                    <div className="md:col-span-4 bg-[#110820]/75 border border-[#2d1b4e] rounded-2xl p-4 shadow-lg min-h-[190px] flex flex-col justify-between">
                                        <span className="text-[10px] font-retro text-purple-300 mb-2 border-b border-[#2d1b4e]/40 pb-1.5">
                                            ✦ 創作されたポエムリスト ({lyricsList.length})
                                        </span>
                                        <div className="flex-1 overflow-y-auto max-h-[220px] space-y-1.5 pr-0.5">
                                            {lyricsList.length === 0 ? (
                                                <p className="text-[10px] text-gray-500 italic text-center my-auto">
                                                    まだ純喫茶で作詞を行っていません。
                                                </p>
                                            ) : (
                                                lyricsList.map((lyric, idx) => (
                                                    <div 
                                                        key={idx} 
                                                        className="p-1 px-2 rounded bg-black/40 border border-[#2d1b4e]/40 font-serif text-[10px] text-[#ff2a85] tracking-wide"
                                                    >
                                                        {lyric}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                </div>

                            </div>
                        </div>
                    </main>
                )}

                {/* Footer */}
                <footer className="border-t border-[#2d1b4e] bg-[#07030d] py-3 px-6 text-center text-[9px] font-mono text-gray-500">
                    <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                        <span>COENJI MELANCHOLIC IDOL WORKSPACE // ALL CHANNELS OPERATIONAL</span>
                        <span>v2.4.0 Standalone Production Build</span>
                    </div>
                </footer>
            </div>
        );
    }

    // Render React components to the structural Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
